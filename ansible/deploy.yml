---
- name: Deploy Nginx Docker container to EC2
  hosts: web
  become: true

  vars:
    container_name: my-nginx-app
    container_port: 80
    host_port: 80

  tasks:
    - name: Install Docker if not installed
      yum:
        name: docker
        state: present

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Login to Amazon ECR
      shell: |
        aws ecr get-login-password --region {{ aws_region }} | \
        docker login --username AWS --password-stdin {{ ecr_repository_url }}
      changed_when: false

    - name: Pull Docker image from ECR
      command: docker pull {{ ecr_repository_url }}:{{ image_tag }}

    - name: Stop old container if it exists
      shell: docker stop {{ container_name }} 2>/dev/null || true
      changed_when: false

    - name: Remove old container if it exists
      shell: docker rm {{ container_name }} 2>/dev/null || true
      changed_when: false

    - name: Run new Docker container
      command: >
        docker run -d
        --name {{ container_name }}
        -p {{ host_port }}:{{ container_port }}
        {{ ecr_repository_url }}:{{ image_tag }}
