name: cd

on:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy. Use latest for the newest image."
        required: true
        default: "latest"

jobs:
  deploy:
    name: Deploy to EC2 with Ansible
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Decide Image Tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.3.0
          terraform_wrapper: false

      - name: Check Infrastructure Outputs
        run: |
          terraform init

          INSTANCE_ID=$(terraform output -raw instance_id 2>/dev/null || true)
          ECR_REPOSITORY_URL=$(terraform output -raw ecr_repository_url 2>/dev/null || true)

          if [ -z "$INSTANCE_ID" ] || [ -z "$ECR_REPOSITORY_URL" ]; then
            echo "Error: Infrastructure is not ready."
            echo "Please run infrastructure.yml with action=apply first."
            exit 1
          fi

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY_URL=$ECR_REPOSITORY_URL" >> "$GITHUB_ENV"

      - name: Get EC2 Public IP
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[*].Instances[*].PublicIpAddress' \
            --output text)

          if [ -z "$PUBLIC_IP" ]; then
            echo "Error: Failed to get EC2 public IP."
            exit 1
          fi

          echo "PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_ENV"

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "ansible-core==2.16.14"
          ansible --version

      - name: Prepare SSH Key
        run: |
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > github-key.pem
          chmod 400 github-key.pem

      - name: Create Ansible Inventory
        run: |
          cat > inventory.ini << EOF
          [web]
          $PUBLIC_IP ansible_user=ec2-user ansible_ssh_private_key_file=github-key.pem ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i inventory.ini \
            ansible/deploy.yml \
            -e "aws_region=eu-central-1" \
            -e "ecr_repository_url=$ECR_REPOSITORY_URL" \
            -e "image_tag=$IMAGE_TAG"

      - name: Print Application URL
        run: |
          echo "App is now accessible at: http://$PUBLIC_IP"