name: cd

on:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy. Use latest for the newest image."
        required: true
        default: "latest"

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Decide Image Tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.3.0
          terraform_wrapper: false

      - name: Check Infrastructure Outputs
        run: |
          terraform init

          INSTANCE_ID=$(terraform output -raw instance_id 2>/dev/null || true)
          ECR_REPOSITORY_URL=$(terraform output -raw ecr_repository_url 2>/dev/null || true)

          if [ -z "$INSTANCE_ID" ] || [ -z "$ECR_REPOSITORY_URL" ]; then
            echo "Error: Infrastructure is not ready."
            echo "Please run infrastructure.yml with action=apply first."
            exit 1
          fi

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY_URL=$ECR_REPOSITORY_URL" >> "$GITHUB_ENV"

      - name: Deploy Docker Container to EC2
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[*].Instances[*].PublicIpAddress' \
            --output text)

          echo "${{ secrets.EC2_PRIVATE_KEY }}" > github-key.pem
          chmod 400 github-key.pem

          ssh -o StrictHostKeyChecking=no -i github-key.pem ec2-user@"$PUBLIC_IP" << EOF
            if ! command -v docker &> /dev/null; then
              sudo yum update -y
              sudo yum install docker -y
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ec2-user
            fi

            aws ecr get-login-password --region eu-central-1 | \
              sudo docker login --username AWS --password-stdin "$ECR_REPOSITORY_URL"

            sudo docker pull "$ECR_REPOSITORY_URL:$IMAGE_TAG"

            sudo docker stop my-nginx-app 2>/dev/null || true
            sudo docker rm my-nginx-app 2>/dev/null || true

            sudo docker run -d \
              --name my-nginx-app \
              -p 80:80 \
              "$ECR_REPOSITORY_URL:$IMAGE_TAG"
          EOF

          echo "App is now accessible at: http://$PUBLIC_IP"