name: ci

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.conf"

  workflow_dispatch:

jobs:
  check:
    name: Check Whether CI Should Run
    runs-on: ubuntu-latest
    outputs:
      skip_ci: ${{ steps.detect.outputs.skip_ci }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Terraform Changes
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual CI run."
            echo "skip_ci=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || true)

          if echo "$CHANGED_FILES" | grep -qE '(^|/).+\.tf$|^terraform.tfvars$'; then
            echo "Terraform files changed in the same push."
            echo "CI will not run automatically."
            echo "Run CI manually after infrastructure is ready."
            echo "skip_ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only application files changed. CI can run."
            echo "skip_ci=false" >> "$GITHUB_OUTPUT"
          fi

  docker:
    name: Docker Image Build and Push
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.skip_ci == 'false' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.3.0
          terraform_wrapper: false

      - name: Check Infrastructure Outputs
        run: |
          terraform init

          ECR_REPOSITORY_URL=$(terraform output -raw ecr_repository_url 2>/dev/null || true)

          if [ -z "$ECR_REPOSITORY_URL" ]; then
            echo "Error: Infrastructure is not ready."
            echo "Please run infrastructure.yml with action=apply first."
            exit 1
          fi

          echo "ECR_REPOSITORY_URL=$ECR_REPOSITORY_URL" >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REPOSITORY_URL:$IMAGE_TAG" \
            -t "$ECR_REPOSITORY_URL:latest" \
            .

          docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY_URL:latest"